<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laptop Cooling Pad - Image Gallery</title>
    <style>
        :root {
            --bg-primary: #101412;
            --bg-secondary: #1a1f1c;
            --text-primary: #eef3ef;
            --text-secondary: #b9c4bc;
            --accent: #d73a49;
            --border: #526158;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.6;
        }

        .container {
            width: min(1200px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 6vw, 48px);
        }

        .subtitle {
            margin: 0;
            color: var(--text-secondary);
            font-size: clamp(16px, 3vw, 20px);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }
        }

        .image-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .image-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: #090b09;
        }

        .image-card img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .image-card:hover img {
            opacity: 0.95;
        }

        .image-title {
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            overflow-wrap: anywhere;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Full-screen image viewer and sliding transitions. */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
            overflow: hidden;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: min(100%, 1200px);
            max-height: 90vh;
        }

        .lightbox-image-frame {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 82vh;
            overflow: hidden;
        }

        .lightbox-image-frame img {
            display: block;
            max-width: 100%;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform: translateX(0);
            opacity: 1;
        }

        /* The outgoing image moves away while the incoming image slides in. */
        .lightbox-image-frame img.slide-out-left {
            animation: slideOutLeft 180ms ease-in both;
        }

        .lightbox-image-frame img.slide-out-right {
            animation: slideOutRight 180ms ease-in both;
        }

        .lightbox-image-frame img.slide-in-left {
            animation: slideInFromLeft 240ms ease-out both;
        }

        .lightbox-image-frame img.slide-in-right {
            animation: slideInFromRight 240ms ease-out both;
        }

        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-100%); opacity: 0; }
        }

        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        @keyframes slideInFromLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInFromRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .lightbox-close,
        .lightbox-nav {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(20, 20, 20, 0.72);
            cursor: pointer;
            z-index: 1010;
            user-select: none;
        }

        .lightbox-close {
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            font-size: 28px;
            line-height: 1;
        }

        .lightbox-nav {
            top: 50%;
            transform: translateY(-50%);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            font-size: 34px;
            line-height: 1;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateY(-50%) scale(1.06);
        }

        .lightbox-nav:focus-visible,
        .lightbox-close:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .lightbox-nav.prev {
            left: 20px;
        }

        .lightbox-nav.next {
            right: 20px;
        }

        .lightbox-counter {
            margin-top: 12px;
            padding: 4px 12px;
            color: var(--text-secondary);
            background: rgba(26, 31, 28, 0.8);
            border: 1px solid var(--border);
            border-radius: 20px;
            font: 14px sans-serif;
            letter-spacing: 1px;
        }

        footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 0;
            }

            header {
                margin-bottom: 32px;
            }

            .lightbox {
                padding: 12px;
            }

            .lightbox-nav {
                width: 44px;
                height: 44px;
                font-size: 28px;
                background: rgba(0, 0, 0, 0.78);
            }

            .lightbox-nav.prev {
                left: 8px;
            }

            .lightbox-nav.next {
                right: 8px;
            }

            .lightbox-image-frame {
                height: 78vh;
            }

            .lightbox-image-frame img {
                max-height: 78vh;
                max-width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .lightbox-image-frame img,
            .lightbox-nav {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📸 Image Gallery</h1>
            <p class="subtitle">Browse all images from the Laptop Cooling Pad project</p>
        </header>

        <main id="gallery" class="gallery-grid" aria-label="Image gallery">
            <!-- Image cards are created by JavaScript. -->
        </main>

        <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
            <button class="lightbox-close" type="button" aria-label="Close image viewer">&times;</button>
            <button class="lightbox-nav prev" type="button" aria-label="Previous image">&#8249;</button>
            <div class="lightbox-content">
                <div class="lightbox-image-frame">
                    <img id="lightbox-image" src="" alt="">
                </div>
                <div id="lightbox-counter" class="lightbox-counter" aria-live="polite"></div>
            </div>
            <button class="lightbox-nav next" type="button" aria-label="Next image">&#8250;</button>
        </div>

        <footer>
            <p>Click any image to view it full size. Use the arrows or keyboard arrow keys to navigate.</p>
        </footer>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-image');
        const lightboxClose = lightbox.querySelector('.lightbox-close');
        const lightboxCounter = document.getElementById('lightbox-counter');
        const buttonPrevious = lightbox.querySelector('.lightbox-nav.prev');
        const buttonNext = lightbox.querySelector('.lightbox-nav.next');

        let currentImageIndex = 0;
        let isTransitioning = false;

        // Keep filenames in sync with the actual files in Project/Images/.
        const images = [
            "IMG20261025123629.jpg",
            "IMG20261025123634.jpg",
            "IMG20261025123648.jpg",
            "IMG20261025123650.jpg",
            "IMG20261025123700.jpg",
            "IMG20261025123733.jpg",
            "IMG20261025123746.jpg",
            "IMG20261025123759.jpg",
            "IMG20261025124053.jpg",
            "IMG20261025124102.jpg",
            "IMG20261027071102.jpg",
            "IMG20261027071113.jpg",
            "IMG20261027071139.jpg",
            "IMG20261027093411.jpg",
            "IMG20261028183836.jpg",
            "IMG20261028183853.jpg",
            "IMG20261028185607.jpg",
            "Screenshot 2026-10-10 054233.png",
            "Screenshot 2026-10-10 054259.png",
            "Screenshot 2026-10-10 054336.png",
            "Screenshot 2026-10-10 054346.png",
            "Screenshot 2026-10-10 054414.png",
            "Screenshot 2026-10-10 054506.png",
            "Screenshot 2026-10-11 012921.png",
            "Screenshot 2026-10-11 013013.png",
            "Screenshot 2026-10-11 013304.png",
            "Screenshot 2026-10-11 013329.png",
            "Screenshot 2026-10-11 013618.png",
            "Screenshot 2026-10-13 111209.png",
            "Screenshot 2026-10-15 133454.png",
            "Screenshot 2026-10-17 113932.png",
            "Screenshot 2026-10-17 171037.png",
            "Screenshot 2026-10-17 183658.png",
            "Screenshot 2026-10-17 185256.png",
            "Screenshot 2026-10-17 190245.png",
            "Screenshot 2026-10-18 140844.png",
            "Screenshot 2026-10-29 014420.png",
            "Screenshot 2026-10-29 014431.png"
        ];

        // Build the thumbnail grid and report missing image files visually.
        images.forEach((filename, index) => {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.dataset.index = String(index);

            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';

            const img = document.createElement('img');
            img.src = `../../Images/${filename}`;
            img.alt = filename;
            img.loading = 'lazy';
            img.addEventListener('error', () => {
                card.classList.add('image-error');
                img.alt = `Image not found: ${filename}`;
                wrapper.style.display = 'flex';
                wrapper.style.alignItems = 'center';
                wrapper.style.justifyContent = 'center';
                wrapper.textContent = `Image not found: ${filename}`;
                wrapper.style.padding = '16px';
                wrapper.style.color = '#eef3ef';
                wrapper.style.overflowWrap = 'anywhere';
            }, { once: true });

            const title = document.createElement('div');
            title.className = 'image-title';
            title.textContent = filename;

            wrapper.appendChild(img);
            card.appendChild(wrapper);
            card.appendChild(title);
            gallery.appendChild(card);

            card.addEventListener('click', () => openLightbox(index));
        });

        function openLightbox(index) {
            currentImageIndex = index;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            setLightboxImage(images[currentImageIndex]);
            lightboxClose.focus();
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            lightboxImg.classList.remove(
                'slide-out-left',
                'slide-out-right',
                'slide-in-left',
                'slide-in-right'
            );
        }

        function setLightboxImage(filename) {
            lightboxImg.classList.remove(
                'slide-out-left',
                'slide-out-right',
                'slide-in-left',
                'slide-in-right'
            );
            lightboxImg.src = `../Images/${filename}`;
            lightboxImg.alt = filename;
            lightboxCounter.textContent = `${currentImageIndex + 1} / ${images.length}`;
        }

        function navigateImage(direction) {
            if (isTransitioning || images.length < 2) {
                return;
            }

            isTransitioning = true;

            // Moving to the next image sends the current image left;
            // moving to the previous image sends it right.
            const outgoingClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
            const incomingClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

            lightboxImg.classList.remove(
                'slide-in-left',
                'slide-in-right',
                'slide-out-left',
                'slide-out-right'
            );
            lightboxImg.classList.add(outgoingClass);

            window.setTimeout(() => {
                currentImageIndex = direction === 'next'
                    ? (currentImageIndex + 1) % images.length
                    : (currentImageIndex - 1 + images.length) % images.length;

                lightboxImg.classList.remove(outgoingClass);
                setLightboxImage(images[currentImageIndex]);
                lightboxImg.classList.add(incomingClass);

                // Release the navigation lock after the entrance animation finishes.
                window.setTimeout(() => {
                    lightboxImg.classList.remove(incomingClass);
                    isTransitioning = false;
                }, 250);
            }, 180);
        }

        lightboxClose.addEventListener('click', closeLightbox);
        buttonPrevious.addEventListener('click', () => navigateImage('previous'));
        buttonNext.addEventListener('click', () => navigateImage('next'));

        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (!lightbox.classList.contains('active')) {
                return;
            }

            if (event.key === 'ArrowLeft') {
                event.preventDefault();
                navigateImage('previous');
            } else if (event.key === 'ArrowRight') {
                event.preventDefault();
                navigateImage('next');
            } else if (event.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
