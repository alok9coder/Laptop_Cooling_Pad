<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laptop Cooling Pad - Image Gallery</title>
  <style>
    :root {
      --bg-primary: #101412;
      --bg-secondary: #1a1f1c;
      --text-primary: #eef3ef;
      --text-secondary: #b9c4bc;
      --accent: #d73a49;
      --border: #526158;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 6vw, 48px);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--text-secondary);
      font-size: clamp(16px, 3vw, 20px);
    }

    /* Grid Layout */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
    }

    /* Image Card */
    .image-card {
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .image-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      padding-top: 75%; /* 4:3 aspect ratio */
      background: #090b09;
    }

    .image-card img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .image-card:hover img {
      opacity: 0.95;
    }

    .image-title {
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      word-break: break-word;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Footer */
    footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .container {
        padding: 24px 0;
      }

      header {
        margin-bottom: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📸 Image Gallery</h1>
      <p class="subtitle">Browse all images from the Laptop Cooling Pad project</p>
    </header>

    <main id="gallery" class="gallery-grid">
      <!-- Images will be loaded dynamically -->
    </main>

    <div id="lightbox" class="lightbox">
      <button class="lightbox-close">&times;</button>
      <img src="" alt="">
    </div>

    <footer>
      <p>Click on any image to view it in full size</p>
    </footer>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const lightboxClose = lightboxClose.querySelector('.lightbox-close');

    // Get all image files from the Images folder
    const images = [
      "IMG20261025123629.jpg",
      "IMG20261025123634.jpg",
      "IMG20261025123648.jpg",
      "IMG20261025123650.jpg",
      "IMG20261025123700.jpg",
      "IMG20261025123733.jpg",
      "IMG20261025123746.jpg",
      "IMG20261025123759.jpg",
      "IMG20261025124053.jpg",
      "IMG20261025124102.jpg",
      "IMG20261027071102.jpg",
      "IMG20261027071113.jpg",
      "IMG20261027071139.jpg",
      "IMG20261027093411.jpg",
      "IMG20261028183836.jpg",
      "IMG20261028183853.jpg",
      "IMG20261028185607.jpg",
      "Screenshot 2026-10-10 054233.png",
      "Screenshot 2026-10-10 054259.png",
      "Screenshot 2026-10-10 054336.png",
      "Screenshot 2026-10-10 054346.png",
      "Screenshot 2026-10-10 054414.png",
      "Screenshot 2026-10-10 054506.png",
      "Screenshot 2026-10-11 012921.png",
      "Screenshot 2026-10-11 013013.png",
      "Screenshot 2026-10-11 013304.png",
      "Screenshot 2026-10-11 013329.png",
      "Screenshot 2026-10-11 013618.png",
      "Screenshot 2026-10-13 111209.png",
      "Screenshot 2026-10-15 133454.png",
      "Screenshot 2026-10-17 113932.png",
      "Screenshot 2026-10-17 171037.png",
      "Screenshot 2026-10-17 183658.png",
      "Screenshot 2026-10-17 185256.png",
      "Screenshot 2026-10-17 190245.png",
      "Screenshot 2026-10-18 140844.png",
      "Screenshot 2026-10-29 014420.png",
      "Screenshot 2026-10-29 014431.png"
    ];

    // Remove non-image files
    const imageFiles = images.filter(filename => {
      return filename.endsWith('.jpg') || 
             filename.endsWith('.jpeg') || 
             filename.endsWith('.png') || 
             filename.endsWith('.gif');
    });

    // Create gallery cards
    imageFiles.forEach((filename, index) => {
      const card = document.createElement('div');
      card.className = 'image-card';
      card.setAttribute('data-index', index);
      
      const wrapper = document.createElement('div');
      wrapper.className = 'image-wrapper';
      
      const img = document.createElement('img');
      img.src = `./Images/${filename}`;
      img.alt = filename;
      img.loading = "lazy";
      
      const title = document.createElement('div');
      title.className = 'image-title';
      title.textContent = filename;
      
      wrapper.appendChild(img);
      card.appendChild(wrapper);
      card.appendChild(title);
      gallery.appendChild(card);
    });

    // Lightbox functionality
    document.querySelectorAll('.image-card').forEach(card => {
      card.addEventListener('click', () => {
        const index = card.getAttribute('data-index');
        openLightbox(index);
      });
    });

    lightboxClose.addEventListener('click', closeLightbox);
    
    // Close on outside click
    document.addEventListener('click', (e) => {
      if (!lightbox.contains(e.target)) {
        closeLightbox();
      }
    });

    function openLightbox(index) {
      const card = document.querySelectorAll('.image-card')[index];
      const filename = card.querySelector('img').src;
      
      lightboxImg.src = filename;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
